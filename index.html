<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous">

<style>
:root {
  --bg: #0b0f17; --panel: #111827; --panel-2: #172033; --line: #243044;
  --text: #e6e9ef; --muted: #94a3b8; --accent: #818cf8; --danger: #dc2626;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", "Hiragino Sans", sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }

/* 언어 탭 */
.langs { display: flex; gap: 2px; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.langs button { background: none; border: 0; border-radius: 6px; padding: 5px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.langs button[aria-pressed="true"] { background: var(--accent); color: #0b0f17; font-weight: 700; }

/* 로그인 */
#login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
#login form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 24px; display: grid; gap: 12px; }
#login .langs { justify-self: end; }
#login h1 { margin: 0 0 4px; font-size: 20px; }
#login p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
#login label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
#login input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; font-size: 16px; }
#login button[type="submit"] { margin-top: 6px; background: var(--accent); color: #0b0f17; border: 0; border-radius: 8px; padding: 12px; font-weight: 700; }
#login .err { color: #fca5a5; font-size: 14px; min-height: 1.2em; margin: 0; }

/* 앱 레이아웃 */
#app { height: 100%; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap; }
.brand { font-size: 17px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.brand .live { background: var(--accent); color: #0b0f17; border-radius: 6px; padding: 1px 6px; font-size: 12px; margin-left: 4px; vertical-align: 2px; }
header .langs { margin-right: auto; }
.controls { display: flex; gap: 6px; align-items: center; }
.controls input, .controls select, .controls button { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; font-size: 14px; }
.controls input { width: 220px; }
.controls button:hover, .controls select:hover { border-color: var(--accent); }

#ticker { display: flex; align-items: center; gap: 10px; height: 36px; border-bottom: 1px solid var(--line);
  background: #0f1522; overflow: hidden; flex: none; }
#ticker .label { background: var(--danger); color: #fff; font-weight: 800; font-size: 12px; padding: 3px 8px;
  border-radius: 4px; margin-left: 12px; flex: none; }
#ticker .track { overflow: hidden; flex: 1; -webkit-mask-image: linear-gradient(90deg, transparent, #000 2%, #000 98%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 2%, #000 98%, transparent); }
#tickerInner { display: inline-flex; gap: 40px; white-space: nowrap; animation: scroll var(--dur, 80s) linear infinite; }
#tickerInner:hover { animation-play-state: paused; }
#tickerInner button { background: none; border: 0; padding: 0; font-size: 14px; }
#tickerInner button:hover { text-decoration: underline; }
#tickerInner i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) {
  #tickerInner { animation: none; } #ticker .track { overflow-x: auto; }
}

#notice { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: #1e1b4b; color: #e0e7ff;
  font-size: 13px; line-height: 1.5; border-bottom: 1px solid var(--line); flex: none; }
#notice button { background: none; border: 1px solid #6366f1; color: inherit; border-radius: 6px; padding: 3px 8px; font-size: 12px; flex: none; }
#notice #noticeClose { margin-left: auto; border: 0; font-size: 18px; line-height: 1; padding: 0 4px; }

main { flex: 1; display: flex; min-height: 0; }
#map { flex: 1; min-width: 0; background: #0b0f17; }
#side { width: 380px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
.side-head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.side-head b { color: var(--text); }
.pinbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px;
  background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 13px; }
.pinbar button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 12px; }
#list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
#list li { border-bottom: 1px solid var(--line); }
#list li > button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; }
#list li > button:hover { background: var(--panel-2); }
#list .more { padding: 14px; color: var(--muted); font-size: 13px; text-align: center; }
.empty { padding: 24px 16px; color: var(--muted); font-size: 14px; line-height: 1.6; }

/* 소식 카드 (목록·팝업 공용) */
.card { display: grid; gap: 5px; }
.card .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; color: #0b0f17; }
.chip.type { background: var(--line); color: var(--text); font-weight: 600; }
.chip.new { background: var(--accent); }
.card .title { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
.card a.title { text-decoration: none; }
.card a.title:hover { text-decoration: underline; }
.card .orig { font-size: 12px; color: var(--muted); line-height: 1.4; }
.card .summary { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
.card .where { font-size: 12px; color: var(--muted); }

/* 지도 위 요소 */
.leaflet-container { font: inherit; background: #0b0f17; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel-2); color: var(--text); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.leaflet-popup-content { margin: 14px 16px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.leaflet-control-attribution { background: rgba(11,15,23,.7) !important; color: var(--muted) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bar a { background: var(--panel); color: var(--text); border-color: var(--line); }
.cl { display: grid; place-items: center; border-radius: 50%; background: rgba(15,21,34,.9); border: 2px solid var(--c);
  color: #fff; font-weight: 800; font-size: 12px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent); }
.legend { background: rgba(17,24,39,.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 6px; max-width: 92vw; }
.legend .row { display: flex; gap: 4px; flex-wrap: wrap; }
.legend button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font-size: 12px; color: var(--text); white-space: nowrap; }
.legend button[aria-pressed="false"] { opacity: .35; text-decoration: line-through; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.legend small { color: var(--muted); margin-left: 3px; }

@media (max-width: 767px) {
  #app { height: auto; min-height: 100%; }
  header { padding: 8px 10px; }
  .controls { width: 100%; }
  .controls input { flex: 1; width: auto; min-width: 0; }
  .controls input, .controls select { font-size: 16px; }   /* 아이폰: 16px보다 작으면 누를 때 화면이 확대됨 */
  main { flex-direction: column; }
  #map { height: 60vh; flex: none; }
  #side { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  #list { overflow: visible; }
  /* 범례는 한 줄로, 옆으로 밀어서 보기 */
  .legend { display: flex; gap: 4px; overflow-x: auto; max-width: calc(100vw - 70px); padding: 6px; }
  .legend .row { flex-wrap: nowrap; }
  .legend button { padding: 6px 10px; }
}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginForm">
    <div class="langs" translate="no"></div>
    <h1 data-i18n="appName"></h1>
    <p data-i18n="loginSub"></p>
    <label><span data-i18n="email"></span> <input id="email" type="email" autocomplete="username" required></label>
    <label><span data-i18n="password"></span> <input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" data-i18n="signIn"></button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><span data-i18n="appName"></span><span class="live">LIVE</span></div>
    <div class="langs" translate="no"></div>
    <div class="controls">
      <input id="q" type="search" data-i18n-ph="search">
      <select id="range">
        <option value="1" data-i18n="range1"></option>
        <option value="6" data-i18n="range6" selected></option>
        <option value="24" data-i18n="range24"></option>
        <option value="72" data-i18n="range72"></option>
      </select>
      <button id="refresh" data-i18n-title="refresh">↻</button>
      <button id="logout" data-i18n="logout"></button>
    </div>
  </header>
  <div id="ticker">
    <span class="label" data-i18n="breaking"></span>
    <div class="track"><div id="tickerInner"></div></div>
  </div>
  <div id="notice" hidden role="status">
    <span id="noticeText"></span>
    <button id="noticeBtn" hidden></button>
    <button id="noticeClose" data-i18n-title="close">×</button>
  </div>
  <main>
    <div id="map" role="region"></div>
    <aside id="side">
      <div class="side-head"><span id="count"></span><span id="updated"></span></div>
      <div class="pinbar" id="pinbar" hidden><span id="pinText"></span><button id="unpin" data-i18n="showAll"></button></div>
      <ol id="list"></ol>
    </aside>
  </main>
</div>

    trNoApi: "このブラウザには翻訳機能が内蔵されていないため、見出しは原文で表示されます。ブラウザの翻訳メニューをお使いください。",
    trDownloading: p => `翻訳エンジンを準備中… ${p}%（初回のみ）`, trClick: "翻訳をオン",
    trNeedClick: "見出しを翻訳するにはボタンを一度押してください。", trUnsupported: "このブラウザはこの言語への翻訳に対応していないため、原文で表示します。",
  },
};

// 브라우저 저장소는 막혀 있을 수 있어서(사생활 보호 모드 등) 실패해도 괜찮게
const local = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let LANG = T[local.get("lang", "ko")] ? local.get("lang", "ko") : "ko";
const t = (key, ...a) => { const v = T[LANG][key]; return typeof v === "function" ? v(...a) : v; };

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

let items = [];                // 불러온 소식 전체 (최신순)
let map, gl, cluster, timer, pinned = null, followView = false;
let loadSeq = 0, fullAt = 0, capped = false, oldestNews = null;
const markerOf = new Map();
const hiddenCats = new Set(local.get("hiddenCats", []));
const hiddenTypes = new Set(local.get("hiddenTypes", []));
$("range").value = String(local.get("range", 6));
// 지난번에 본 이후 새로 들어온 소식에 NEW 표시 (앱을 닫거나 다른 앱으로 가면 "본 것"으로 기록)
let prevVisit = Date.parse(local.get("lastVisit", "")) || 0;
local.set("lastVisit", new Date().toISOString());

const catOf = it => (CAT_COLORS[it.category] ? it.category : "general");
const colorOf = it => CAT_COLORS[catOf(it)];
const isNew = it => prevVisit && it._c > prevVisit;
const hasCoords = it => typeof it.latitude === "number" && typeof it.longitude === "number";
const isPhone = () => window.matchMedia("(max-width: 767px)").matches;
const prep = it => Object.assign(it, { _t: Date.parse(it.published_at), _c: Date.parse(it.collected_at) });

// 날짜 도구는 만들기가 느려서 언어별로 한 번만 만들어 재사용
const fmtCache = {};
const fmt = () => (fmtCache[LANG] ??= {
  rel: new Intl.RelativeTimeFormat(LOCALE[LANG], { numeric: "always" }),
  abs: new Intl.DateTimeFormat(LOCALE[LANG], { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }),
});
function ago(ms) {
  const s = (ms - Date.now()) / 1000, r = fmt().rel;
  if (Math.abs(s) < 60) return t("justNow");
  if (Math.abs(s) < 3600) return r.format(Math.round(s / 60), "minute");
  if (Math.abs(s) < 86400) return r.format(Math.round(s / 3600), "hour");
  return r.format(Math.round(s / 86400), "day");
}
const kst = ms => fmt().abs.format(ms);

// ── 번역 (브라우저 내장 번역 기능: 무료, 기사 내용이 밖으로 나가지 않음) ─────────
const canTranslate = "Translator" in self;
const translators = new Map();   // "en>ko" → Promise<번역기 또는 null>
const trCache = new Map();       // "ko|원문" → 번역문
const trPending = new Map();
let trChain = Promise.resolve(), noticeClosed = false;
const srcLang = s => (/[가-힣]/.test(s) ? "ko" : /[぀-ヿ]/.test(s) ? "ja" : "en");

function translator(src, tgt) {
  const k = `${src}>${tgt}`;
  if (!translators.has(k)) translators.set(k, (async () => {
    const avail = await Promise.race([
      Translator.availability({ sourceLanguage: src, targetLanguage: tgt }),
      new Promise(r => setTimeout(() => r("timeout"), 10000)),
    ]);
    if (avail === "unavailable" || avail === "timeout") { notice(t("trUnsupported")); return null; }
    const tr = await Translator.create({ sourceLanguage: src, targetLanguage: tgt, monitor(m) {
      m.addEventListener("downloadprogress", e => notice(t("trDownloading", Math.round(e.loaded * 100))));
    } });
    notice("");
    return tr;
  })().catch(() => {
    // 번역 엔진을 처음 내려받을 땐 사용자가 한 번 눌러줘야 함(브라우저 규칙)
    translators.delete(k);
    notice(t("trNeedClick"), t("trClick"), () => { notice(""); translator(src, tgt).then(tr => tr && render()); });
    return null;
  }));
  return translators.get(k);
}

function translate(text, tgt) {
  const key = `${tgt}|${text}`;
  if (trCache.has(key)) return Promise.resolve(trCache.get(key));
  if (!trPending.has(key)) {
    const job = trChain.then(async () => {
      if (tgt !== LANG) return null;              // 그 사이 언어를 바꿨으면 건너뜀
      const tr = await translator(srcLang(text), tgt);
      if (!tr || tgt !== LANG) return null;
      const out = await tr.translate(text);
      trCache.set(key, out);
      return out;
    }).catch(() => null).finally(() => trPending.delete(key));
    trPending.set(key, job);
    trChain = job;                                // 한 번에 하나씩 차례로
  }
  return trPending.get(key);
}

// 외부에서 온 글은 반드시 textContent로 넣음. 선택한 언어와 다르면 번역해서 바꿔 끼움.
function setText(node, text, origNode) {
  node.textContent = text;
  const src = srcLang(text);
  node.lang = src;
  if (src === LANG || !canTranslate || !text) return;
  const show = out => {
    if (!out) return;
    node.textContent = out; node.lang = LANG; node.title = text;
    if (origNode) { origNode.textContent = `${t("original")}: ${text}`; origNode.lang = src; origNode.hidden = false; }
  };
  const key = `${LANG}|${text}`;
  if (trCache.has(key)) return show(trCache.get(key));
  const want = LANG;
  translate(text, want).then(out => want === LANG && show(out));
}

function notice(text, btnText, onBtn) {
  const box = $("notice");
  if (!text || noticeClosed) { box.hidden = true; return; }
  $("noticeText").textContent = text;
  const btn = $("noticeBtn");
  btn.hidden = !btnText;
  if (btnText) { btn.textContent = btnText; btn.onclick = onBtn; }
  box.hidden = false;
}
$("noticeClose").addEventListener("click", () => { noticeClosed = true; $("notice").hidden = true; });

// 화면 글자·언어 탭
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = t("appName");
  for (const e of document.querySelectorAll("[data-i18n]")) e.textContent = t(e.dataset.i18n);
  for (const e of document.querySelectorAll("[data-i18n-ph]")) { e.placeholder = t(e.dataset.i18nPh); e.setAttribute("aria-label", t(e.dataset.i18nPh)); }
  for (const e of document.querySelectorAll("[data-i18n-title]")) { e.title = t(e.dataset.i18nTitle); e.setAttribute("aria-label", t(e.dataset.i18nTitle)); }
  for (const box of document.querySelectorAll(".langs")) {
    box.replaceChildren(...Object.entries(LANGS).map(([code, name]) => {
      const b = el("button", null, name);
      b.type = "button"; b.lang = code;
      b.setAttribute("aria-pressed", String(code === LANG));
      b.addEventListener("click", () => setLang(code));
      return b;
    }));
  }
}

function setLang(code) {
  if (code === LANG) return;
  LANG = code;
  local.set("lang", code);
  noticeClosed = false;
  notice("");
  if (canTranslate && code !== "en") translator("en", code);   // 누른 순간 바로 준비 시작(브라우저 규칙상 클릭 직후여야 함)
  else if (!canTranslate && code !== "en") notice(t("trNoApi"));
  applyStatic();
  setMapLabels();
  if (map) { map.closePopup(); stamp(false); if (items.length) render(); }
}

// ── 로그인 ───────────────────────────────────────────────────────────
db.auth.onAuthStateChange((_event, session) => {
  // 이 콜백 안에서 바로 DB를 부르면 멈출 수 있어서 한 박자 뒤에 실행
  setTimeout(() => (session ? showApp() : showLogin()), 0);
});

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  const btn = e.submitter; btn.disabled = true;
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  btn.disabled = false;
  if (error) $("loginErr").textContent = /invalid/i.test(error.message) ? t("badLogin") : error.message;
});
$("logout").addEventListener("click", () => db.auth.signOut());

function showLogin() {
  clearInterval(timer);
  $("app").hidden = true; $("login").hidden = false;
}

function showApp() {
  if (!$("app").hidden) return;
  $("login").hidden = true; $("app").hidden = false;
  if (!map) initMap(); else map.invalidateSize();
  if (canTranslate && LANG !== "en") translator("en", LANG);
  else if (!canTranslate && LANG !== "en") notice(t("trNoApi"));
  load();
  clearInterval(timer);
  timer = setInterval(() => document.visibilityState === "visible" && refresh(), REFRESH_MIN * 60e3);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { local.set("lastVisit", new Date().toISOString()); return; }
  // 휴대폰에서 다시 켰을 때: 그 사이 들어온 것만 NEW, 바로 새 소식 확인
  prevVisit = Date.parse(local.get("lastVisit", "")) || prevVisit;
  if (map && !$("app").hidden) refresh();
});

// ── 지도 ─────────────────────────────────────────────────────────────
function initMap() {
  map = L.map("map", {
    worldCopyJump: true, zoomControl: false, zoomSnap: 0.5,
    minZoom: 1,    // 배경 지도가 이보다 작게는 그려지지 않음
    maxZoom: 12,   // 기사 위치는 도시·나라 단위라 더 확대해도 의미 없음
    renderer: L.canvas({ tolerance: 8 }),   // 작은 점도 손가락으로 누르기 쉽게
  });
  // 화면 폭에 맞춰 세계가 최대한 한 화면에 들어오게 (휴대폰은 한국~미국 동부까지)
  const w = $("map").clientWidth;
  map.setView([28, w < 600 ? 50 : 40], Math.max(1, Math.min(2.5, Math.floor(Math.log2(w / 256) * 2) / 2)));
  map.once("movestart", () => { followView = true; });
  L.control.zoom({ position: "topright" }).addTo(map);

  gl = L.maplibreGL({ style: MAP_STYLE }).addTo(map);
  const m = gl.getMaplibreMap();
  if (m.isStyleLoaded()) setMapLabels(); else m.once("load", setMapLabels);

  cluster = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 45, iconCreateFunction: clusterIcon,
    zoomToBoundsOnClick: false, spiderfyOnMaxZoom: false,
  });
  // 여러 소식이 한 점에 모여 있으면(나라 중심점 등) 점을 퍼뜨리지 않고 목록으로 보여줌
  cluster.on("clusterclick", e => {
    const b = e.layer.getBounds();
    if (b.getNorthEast().equals(b.getSouthWest()) || map.getZoom() >= map.getMaxZoom()) {
      pinned = e.layer.getAllChildMarkers().map(mk => mk.item).sort((a, b2) => b2._t - a._t);
      renderList();
      if (isPhone()) $("side").scrollIntoView({ behavior: "smooth" });
    } else {
      e.layer.zoomToBounds({ padding: [30, 30] });
    }
  });
  map.addLayer(cluster);
  map.on("moveend", renderList);

  const legend = L.control({ position: isPhone() ? "topleft" : "bottomleft" });
  legend.onAdd = () => {
    const box = L.DomUtil.create("div", "legend");
    L.DomEvent.disableClickPropagation(box);
    L.DomEvent.disableScrollPropagation(box);
    box.id = "legend";
    return box;
  };
  legend.addTo(map);
}

// 지도 속 지명을 선택한 언어로 (없으면 영어 → 원래 이름)
let labelLayers = null;
function setMapLabels() {
  const m = gl?.getMaplibreMap();
  if (!m || !m.isStyleLoaded()) return;
  labelLayers ??= m.getStyle().layers
    .filter(l => JSON.stringify(l.layout?.["text-field"] ?? "").includes('"name'))
    .map(l => l.id);
  const expr = ["coalesce", ["get", `name:${LANG}`], ...(LANG === "en" ? [] : [["get", "name:en"]]), ["get", "name:latin"], ["get", "name"]];
  for (const id of labelLayers) m.setLayoutProperty(id, "text-field", expr);
}

// 여러 소식이 모인 원: 가장 많은 분야의 색으로 테두리
function clusterIcon(c) {
  const tally = {};
  for (const mk of c.getAllChildMarkers()) tally[catOf(mk.item)] = (tally[catOf(mk.item)] || 0) + 1;
  const top = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0] || "general";
  const n = c.getChildCount(), size = n < 10 ? 30 : n < 100 ? 38 : 46;
  return L.divIcon({ html: `<div class="cl" style="--c:${CAT_COLORS[top]};width:${size}px;height:${size}px">${n}</div>`,
    className: "", iconSize: [size, size] });
}

function makeMarker(it) {
  const official = it.source_type === "official";
  const mk = L.circleMarker([it.latitude, it.longitude], {
    radius: official ? 8 : 6, color: official ? "#ffffff" : "#0b0f17", weight: official ? 2 : 1,
    fillColor: colorOf(it), fillOpacity: 0.9,
  });
  mk.item = it;
  mk.on("click", () => openItem(it, false));
  return mk;
}

// 팝업은 지도에 따로 띄워서, 새 소식이 들어와 점들을 다시 그려도 닫히지 않음
function openItem(it, move) {
  if (!hasCoords(it)) { if (/^https?:\/\//i.test(it.url)) window.open(it.url, "_blank", "noopener,noreferrer"); return; }
  const ll = [it.latitude, it.longitude];
  if (move) {
    if (isPhone()) $("map").scrollIntoView({ behavior: "smooth" });
    map.setView(ll, Math.max(map.getZoom(), 4));
  }
  L.popup({ maxWidth: 320, minWidth: 240, autoPanPadding: [20, 20] }).setLatLng(ll).setContent(card(it, true)).openOn(map);
}

// ── 소식 카드 ────────────────────────────────────────────────────────
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function card(it, inPopup) {
  const box = el("div", "card");
  const meta = box.appendChild(el("div", "meta"));
  const chip = meta.appendChild(el("span", "chip", T[LANG].cats[catOf(it)]));
  chip.style.background = colorOf(it);
  meta.appendChild(el("span", "chip type", T[LANG].types[it.source_type] || it.source_type));
  if (isNew(it)) meta.appendChild(el("span", "chip new", "NEW"));
  meta.appendChild(el("span", null, `${ago(it._t)} · ${kst(it._t)}`));
  let title;
  if (inPopup && /^https?:\/\//i.test(it.url)) {
    title = box.appendChild(el("a", "title"));
    title.href = it.url; title.target = "_blank"; title.rel = "noopener noreferrer";
  } else {
    title = box.appendChild(el("div", "title"));
  }
  const orig = inPopup ? el("div", "orig") : null;
  if (orig) { orig.hidden = true; box.appendChild(orig); }
  setText(title, it.title, orig);
  if (it.summary && inPopup) setText(box.appendChild(el("div", "summary")), it.summary);
  const where = box.appendChild(el("div", "where"));
  where.append("📍 ");
  const place = where.appendChild(el("span"));
  if (inPopup) setText(place, it.location_name || it.country || t("unknownPlace"));
  else place.textContent = it.location_name || it.country || t("unknownPlace");
  where.append(` · ${it.source_name}`);
  return box;
}

// ── 불러오기 ─────────────────────────────────────────────────────────
async function fetchRows(query, cap) {
  const rows = [];
  for (let from = 0; from < cap; from += PAGE) {
    const { data, error } = await query().range(from, Math.min(from + PAGE, cap) - 1);
    if (error) throw error;
    rows.push(...data);
    if (data.length < PAGE) break;
  }
  return rows;
}
const sinceIso = () => new Date(Date.now() - Number($("range").value) * 3600e3).toISOString();

async function load() {
  const seq = ++loadSeq, since = sinceIso();
  // 같은 시각인 기사가 많아서, id까지 순서에 넣어야 나눠 받을 때 빠지거나 겹치지 않음
  const base = () => db.from("news").select(COLS).gte("published_at", since)
    .order("published_at", { ascending: false }).order("id", { ascending: false });
  $("refresh").disabled = true;
  if (!items.length) $("count").textContent = t("loading");
  try {
    const [news, official] = await Promise.all([
      fetchRows(() => base().neq("source_type", "official"), NEWS_CAP),
      fetchRows(() => base().eq("source_type", "official"), 3000),
    ]);
    if (seq !== loadSeq) return;                  // 그 사이 기간을 바꿔 새로 불렀으면 이 결과는 버림
    const seen = new Set();
    items = [...official, ...news].filter(it => !seen.has(it.url) && seen.add(it.url)).map(prep).sort((a, b) => b._t - a._t);
    capped = news.length >= NEWS_CAP;
    oldestNews = news.length ? Date.parse(news[news.length - 1].published_at) : null;
    fullAt = Date.now();
    stamp();
    render();
  } catch (err) {
    if (seq !== loadSeq) return;
    if (err?.status === 401 || /JWT|token/i.test(err?.message || "")) return db.auth.signOut();
    $("count").textContent = t("loadFail");
    $("list").replaceChildren(el("li", "empty", t("retry", err?.message || String(err))));
  } finally {
    if (seq === loadSeq) $("refresh").disabled = false;
  }
}

// 새로 들어온 소식만 받아서 붙임 (데이터를 적게 쓰고, 보던 팝업도 그대로)
async function refresh() {
  if (!items.length || Date.now() - fullAt > FULL_RELOAD_MIN * 60e3) return load();
  const seq = loadSeq, since = sinceIso();
  const newest = new Date(Math.max(...items.map(it => it._c))).toISOString();
  try {
    const rows = await fetchRows(() => db.from("news").select(COLS).gt("collected_at", newest).gte("published_at", since)
      .order("collected_at", { ascending: false }).order("id", { ascending: false }), 5000);
    if (seq !== loadSeq) return;
    const cutoff = Date.parse(since);
    const byUrl = new Map(items.map(it => [it.url, it]));
    for (const r of rows) byUrl.set(r.url, prep(r));
    const before = items.length;
    items = [...byUrl.values()].filter(it => it._t >= cutoff).sort((a, b) => b._t - a._t);
    stamp();
    if (rows.length || items.length !== before) render();
  } catch { /* 다음 차례에 다시 시도 */ }
}
let stampAt = 0;   // 마지막으로 받아온 시각 (언어를 바꾸면 같은 시각을 새 언어로 다시 표시)
const stamp = (fresh = true) => { if (fresh) stampAt = Date.now(); $("updated").textContent = stampAt ? t("asOf", kst(stampAt)) : ""; };

// ── 그리기 ───────────────────────────────────────────────────────────
function filtered() {
  const q = $("q").value.trim().toLowerCase();
  return items.filter(it => {
    if (hiddenCats.has(catOf(it)) || hiddenTypes.has(it.source_type)) return false;
    if (!q) return true;
    const tr = trCache.get(`${LANG}|${it.title}`) || "";
    return `${it.title} ${tr} ${it.country || ""} ${it.location_name || ""} ${it.source_name}`.toLowerCase().includes(q);
  });
}

function render() {
  const shown = filtered();
  markerOf.clear();
  cluster.clearLayers();
  cluster.addLayers(shown.filter(hasCoords).map(it => { const mk = makeMarker(it); markerOf.set(it, mk); return mk; }));
  if (pinned) { const byUrl = new Map(items.map(it => [it.url, it])); pinned = pinned.map(p => byUrl.get(p.url)).filter(Boolean); }
  renderLegend();
  renderTicker(shown);
  renderList();
}

// 지금 지도 화면 안에 있는 소식만 목록에 (좌표 없는 소식은 항상). 지도에 그려진 점과 똑같은 기준.
function inView(it, b) {
  if (!hasCoords(it)) return true;
  if (b.getEast() - b.getWest() >= 360) return b.getSouth() <= it.latitude && it.latitude <= b.getNorth();
  return b.contains([it.latitude, it.longitude]);
}

function renderList() {
  if (!map) return;
  const all = filtered(), b = map.getBounds();
  // 지도를 직접 움직이기 전까지는 전체 목록, 움직인 뒤로는 화면에 보이는 지역만
  const shown = pinned || (followView ? all.filter(it => inView(it, b)) : all);
  const newCount = all.filter(isNew).length;
  $("count").textContent = t("count", shown.length.toLocaleString(), all.length.toLocaleString(), newCount ? newCount.toLocaleString() : "")
    + (capped && oldestNews ? t("capped", kst(oldestNews)) : "");
  $("pinbar").hidden = !pinned;
  if (pinned) $("pinText").textContent = t("pinned", pinned.length.toLocaleString());
  const list = $("list");
  if (!shown.length) {
    list.replaceChildren(el("li", "empty", items.length ? t("emptyArea") : t("emptyAll")));
    return;
  }
  const lis = shown.slice(0, LIST_MAX).map(it => {
    const li = el("li"), btn = li.appendChild(el("button"));
    btn.type = "button";
    btn.appendChild(card(it, false));
    btn.addEventListener("click", () => openItem(it, true));
    return li;
  });
  if (shown.length > LIST_MAX) lis.push(el("li", "more", t("more", (shown.length - LIST_MAX).toLocaleString())));
  list.replaceChildren(...lis);
  list.scrollTop = 0;   // 목록이 바뀌면 맨 위부터
}
$("unpin").addEventListener("click", () => { pinned = null; renderList(); });

// 속보 띠: 공식 발표·통신사 소식 최신 15건 (없으면 전체에서)
function renderTicker(pool) {
  let top = pool.filter(it => it.source_type === "official" || it.source_type === "wire").slice(0, 15);
  if (!top.length) top = pool.slice(0, 15);
  const make = () => top.map(it => {
    const b = el("button");
    b.type = "button";
    const dot = b.appendChild(el("i")); dot.style.background = colorOf(it);
    b.append(`[${T[LANG].types[it.source_type] || ""}] `);
    setText(b.appendChild(el("span")), it.title);
    b.append(` · ${ago(it._t)}`);
    b.addEventListener("click", () => openItem(it, true));
    return b;
  });
  const inner = $("tickerInner");
  inner.replaceChildren(...make(), ...make());   // 두 번 이어 붙여 끊김 없이 흐르게
  inner.style.setProperty("--dur", `${Math.max(30, top.length * 7)}s`);
}

function renderLegend() {
  const box = $("legend");
  const counts = {}, typeCounts = {};
  for (const it of items) { counts[catOf(it)] = (counts[catOf(it)] || 0) + 1; typeCounts[it.source_type] = (typeCounts[it.source_type] || 0) + 1; }
  const toggle = (set, key, storeKey) => () => {
    set.has(key) ? set.delete(key) : set.add(key);
    local.set(storeKey, [...set]);
    render();
  };
  const catRow = el("div", "row"), typeRow = el("div", "row");
  for (const key of Object.keys(CAT_COLORS)) {
    if (!counts[key]) continue;
    const b = el("button"); b.type = "button";
    b.setAttribute("aria-pressed", String(!hiddenCats.has(key)));
    const dot = b.appendChild(el("i")); dot.style.background = CAT_COLORS[key];
    b.append(T[LANG].cats[key], el("small", null, counts[key].toLocaleString()));
    b.addEventListener("click", toggle(hiddenCats, key, "hiddenCats"));
    catRow.appendChild(b);
  }
  for (const key of TYPE_KEYS) {
    if (!typeCounts[key]) continue;
    const b = el("button"); b.type = "button";
    b.setAttribute("aria-pressed", String(!hiddenTypes.has(key)));
    b.append(T[LANG].types[key], el("small", null, typeCounts[key].toLocaleString()));
    b.addEventListener("click", toggle(hiddenTypes, key, "hiddenTypes"));
    typeRow.appendChild(b);
  }
  box.replaceChildren(catRow, typeRow);
}

// ── 조작 ─────────────────────────────────────────────────────────────
let typing;
$("q").addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(render, 300); });
$("range").addEventListener("change", () => { local.set("range", Number($("range").value)); pinned = null; load(); });
$("refresh").addEventListener("click", load);
applyStatic();
</script>
