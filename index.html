<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f17">
<title>세계 뉴스 지도</title>
<!-- 외부 부품은 버전을 고정하고 integrity(위변조 검사)를 붙임: 부품 서버 파일이 바뀌면 실행 안 됨 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
<style>
:root {
  --bg: #0b0f17; --panel: #111827; --panel-2: #172033; --line: #243044;
  --text: #e6e9ef; --muted: #94a3b8; --accent: #818cf8; --danger: #dc2626;
  --up: #f87171; --down: #60a5fa;          /* 시세 오름·내림: 한국·일본식(오름 빨강, 내림 파랑). 항상 ▲▼ 기호와 함께 */
}
html[lang="en"] { --up: #4ade80; --down: #f87171; }   /* 영어 화면은 미국식(오름 초록, 내림 빨강) */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", "Hiragino Sans", sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }

/* 언어 탭 */
.langs { display: flex; gap: 2px; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.langs button { background: none; border: 0; border-radius: 6px; padding: 5px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.langs button[aria-pressed="true"] { background: var(--accent); color: #0b0f17; font-weight: 700; }

/* 로그인 */
#login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
#login form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 24px; display: grid; gap: 12px; }
#login .langs { justify-self: end; }
#login h1 { margin: 0 0 4px; font-size: 20px; }
#login p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
#login label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
#login input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; font-size: 16px; }
#login button[type="submit"] { margin-top: 6px; background: var(--accent); color: #0b0f17; border: 0; border-radius: 8px; padding: 12px; font-weight: 700; }
#login .err { color: #fca5a5; font-size: 14px; min-height: 1.2em; margin: 0; }

/* 앱 레이아웃 */
#app { height: 100%; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap; }
.brand { font-size: 17px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.brand .live { background: var(--accent); color: #0b0f17; border-radius: 6px; padding: 1px 6px; font-size: 12px; margin-left: 4px; vertical-align: 2px; }
header .langs { margin-right: auto; }
.controls { display: flex; gap: 6px; align-items: center; }
.controls input, .controls select, .controls button { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; font-size: 14px; }
.controls input { width: 220px; }
.controls button:hover, .controls select:hover { border-color: var(--accent); }

#ticker { display: flex; align-items: center; gap: 10px; height: 36px; border-bottom: 1px solid var(--line);
  background: #0f1522; overflow: hidden; flex: none; }
#ticker .label { background: var(--danger); color: #fff; font-weight: 800; font-size: 12px; padding: 3px 8px;
  border-radius: 4px; margin-left: 12px; flex: none; }
#ticker .track { overflow: hidden; flex: 1; -webkit-mask-image: linear-gradient(90deg, transparent, #000 2%, #000 98%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 2%, #000 98%, transparent); }
#tickerInner { display: inline-flex; gap: 40px; white-space: nowrap; animation: scroll var(--dur, 80s) linear infinite; }
#tickerInner:hover { animation-play-state: paused; }
#tickerInner button { background: none; border: 0; padding: 0; font-size: 14px; }
#tickerInner button:hover { text-decoration: underline; }
#tickerInner i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) {
  #tickerInner { animation: none; } #ticker .track { overflow-x: auto; }
}

#notice { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: #1e1b4b; color: #e0e7ff;
  font-size: 13px; line-height: 1.5; border-bottom: 1px solid var(--line); flex: none; }
#notice button { background: none; border: 1px solid #6366f1; color: inherit; border-radius: 6px; padding: 3px 8px; font-size: 12px; flex: none; }
#notice #noticeClose { margin-left: auto; border: 0; font-size: 18px; line-height: 1; padding: 0 4px; }

/* 지역 탭 (지구본을 돌려 그 지역으로) */
#regions { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--panel); flex: none;
  scrollbar-width: thin; }
#regions button { flex: none; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
#regions button small { color: var(--muted); margin-left: 5px; font-size: 11px; }
#regions button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b0f17; font-weight: 700; }
#regions button[aria-pressed="true"] small { color: #1e1b4b; }

main { flex: 1; display: flex; min-height: 0; }
#map { flex: 1; min-width: 0; position: relative; background: radial-gradient(circle at 50% 45%, #121a2b 0%, #06080d 70%); }
#side { width: 380px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
.side-head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pinbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px;
  background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 13px; }
.pinbar button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 12px; }
#list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
#list li { border-bottom: 1px solid var(--line); }
#list li > button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; }
#list li > button:hover { background: var(--panel-2); }
#list .more { padding: 14px; color: var(--muted); font-size: 13px; text-align: center; }
.empty { padding: 24px 16px; color: var(--muted); font-size: 14px; line-height: 1.6; }

/* 소식 카드 (목록·팝업 공용) */
.card { display: grid; gap: 5px; }
.card .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; color: #0b0f17; }
.chip.type { background: var(--line); color: var(--text); font-weight: 600; }
.chip.new { background: var(--accent); }
.card .title { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
.card a.title { text-decoration: none; }
.card a.title:hover { text-decoration: underline; }
.card .orig { font-size: 12px; color: var(--muted); line-height: 1.4; }
.card .summary { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
.card .where { font-size: 12px; color: var(--muted); }

/* 지도 위 요소 */
.maplibregl-popup-content { background: var(--panel-2); color: var(--text); border-radius: 10px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.5); max-width: 320px; }
.maplibregl-popup-tip { border-top-color: var(--panel-2) !important; border-bottom-color: var(--panel-2) !important; }
.maplibregl-popup-close-button { color: var(--muted); font-size: 18px; padding: 0 6px; }
.maplibregl-ctrl-attrib { background: rgba(11,15,23,.7) !important; color: var(--muted); font-size: 10px; }
.maplibregl-ctrl-attrib a { color: var(--muted) !important; }
.legend { position: absolute; left: 10px; bottom: 30px; z-index: 2; background: rgba(17,24,39,.92); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px; display: grid; gap: 6px; max-width: calc(100% - 20px); }
.legend .row { display: flex; gap: 4px; flex-wrap: wrap; }
.legend button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font-size: 12px; color: var(--text); white-space: nowrap; }
.legend button[aria-pressed="false"] { opacity: .35; text-decoration: line-through; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.legend .cat-ic { margin-right: 5px; vertical-align: -3px; }
.legend small { color: var(--muted); margin-left: 3px; }

/* 시세: 위쪽 띠(주요 품목) + 옆 칸 "시세" 탭(품목별 카드·추세선) */
#mstrip { display: flex; gap: 6px; padding: 6px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); background: #0f1522;
  flex: none; scrollbar-width: thin; }
#mstrip:empty { display: none; }
#mstrip button { flex: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px;
  font-size: 12.5px; white-space: nowrap; display: flex; gap: 6px; align-items: baseline; }
#mstrip button:hover { border-color: var(--accent); }
#mstrip .n { color: var(--muted); }
#mstrip .v { font-weight: 700; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.side-tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.side-tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px; font-size: 14px; color: var(--muted); }
.side-tabs button[aria-selected="true"] { color: var(--text); font-weight: 700; border-bottom-color: var(--accent); }
#side[data-tab="market"] > :not(.side-tabs):not(#market) { display: none !important; }
#side:not([data-tab="market"]) #market { display: none; }
#market { overflow-y: auto; flex: 1; padding: 4px 12px 16px; }
#market h3 { font-size: 12px; color: var(--muted); font-weight: 700; margin: 14px 2px 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 8px; display: grid; gap: 3px;
  position: relative; scroll-margin-top: 8px; }
.tile.flash { border-color: var(--accent); }
.tile .lbl { font-size: 12.5px; color: var(--muted); }
.tile .val { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.tile .val small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.tile .dlt { font-size: 12px; font-weight: 600; }
.tile .val small.k { margin: 0 6px 0 0; font-size: 12px; }   /* 금 카드: "1g"·"1돈" 표시 */
/* 살 때·팔 때 카드 (우리은행): 한 줄을 다 쓰는 작은 표 — 행 = 살 때·팔 때, 열 = 1g·1돈 */
.tile.wide { grid-column: 1 / -1; }
.tile table.pt { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; margin: 2px 0; }
.tile table.pt th { font-size: 11px; color: var(--muted); font-weight: 600; text-align: right; padding: 0 0 2px; }
.tile table.pt td { font-size: 15px; font-weight: 700; text-align: right; padding: 3px 0; }
.tile table.pt th:first-child, .tile table.pt td:first-child { text-align: left; }
.tile .tag { font-size: 11px; font-weight: 700; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
.tile .tag.buy { border-color: var(--accent); color: var(--text); }
.tile .asof { font-size: 11px; color: var(--muted); }
.tile svg { width: 100%; height: 34px; display: block; margin-top: 4px; overflow: visible; touch-action: pan-y; }
.tile .tip { position: absolute; right: 10px; top: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 2px 6px; font-size: 11px; pointer-events: none; white-space: nowrap; }
.mnote { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin: 16px 2px 0; }

@media (max-width: 767px) {
  #app { height: auto; min-height: 100%; }
  #market { overflow: visible; }
  header { padding: 8px 10px; }
  .controls { width: 100%; }
  .controls input { flex: 1; width: auto; min-width: 0; }
  .controls input, .controls select { font-size: 16px; }   /* 아이폰: 16px보다 작으면 누를 때 화면이 확대됨 */
  #regions button { padding: 7px 12px; }
  main { flex-direction: column; }
  #map { height: 60vh; flex: none; }
  #side { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  #list { overflow: visible; }
  /* 범례는 위쪽 한 줄로, 옆으로 밀어서 보기 */
  .legend { top: 10px; bottom: auto; display: flex; gap: 4px; overflow-x: auto; max-width: calc(100% - 64px); padding: 6px; }
  .legend .row { flex-wrap: nowrap; }
  .legend button { padding: 6px 10px; }
}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginForm">
    <div class="langs" translate="no"></div>
    <h1 data-i18n="appName"></h1>
    <p data-i18n="loginSub"></p>
    <label><span data-i18n="email"></span> <input id="email" type="email" autocomplete="username" required></label>
    <label><span data-i18n="password"></span> <input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" data-i18n="signIn"></button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><span data-i18n="appName"></span><span class="live">LIVE</span></div>
    <div class="langs" translate="no"></div>
    <div class="controls">
      <input id="q" type="search" data-i18n-ph="search">
      <select id="range">
        <option value="1" data-i18n="range1"></option>
        <option value="6" data-i18n="range6"></option>
        <option value="24" data-i18n="range24" selected></option>
        <option value="72" data-i18n="range72"></option>
      </select>
      <button id="refresh" data-i18n-title="refresh">↻</button>
      <button id="logout" data-i18n="logout"></button>
    </div>
  </header>
  <div id="ticker">
    <span class="label" data-i18n="breaking"></span>
    <div class="track"><div id="tickerInner"></div></div>
  </div>
  <div id="mstrip" data-i18n-aria="tabMarket"></div>
  <div id="notice" hidden role="status">
    <span id="noticeText"></span>
    <button id="noticeBtn" hidden></button>
    <button id="noticeClose" data-i18n-title="close">×</button>
  </div>
  <nav id="regions" data-i18n-aria="regionsLabel"></nav>
  <main>
    <div id="map" role="region"><div class="legend" id="legend"></div></div>
    <aside id="side">
      <div class="side-tabs" role="tablist">
        <button id="tabNews" role="tab" aria-controls="list" data-i18n="tabNews"></button>
        <button id="tabMarket" role="tab" aria-controls="market" data-i18n="tabMarket"></button>
      </div>
      <div class="side-head"><span id="count"></span><span id="updated"></span></div>
      <div class="pinbar" id="pinbar" hidden><span id="pinText"></span><button id="unpin" data-i18n="showAll"></button></div>
      <ol id="list"></ol>
      <section id="market" role="tabpanel" aria-labelledby="tabMarket"></section>
    </aside>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script>

  if (!boxes) return true;
  return hasCoords(it) && boxes.some(([w, s, e, n]) => it.longitude >= w && it.longitude <= e && it.latitude >= s && it.latitude <= n);

// 날짜 도구는 만들기가 느려서 언어별로 한 번만 만들어 재사용
const fmtCache = {};
const fmt = () => (fmtCache[LANG] ??= {
  rel: new Intl.RelativeTimeFormat(LOCALE[LANG], { numeric: "always" }),
  abs: new Intl.DateTimeFormat(LOCALE[LANG], { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }),
});
function ago(ms) {
  const s = (ms - Date.now()) / 1000, r = fmt().rel;
  if (Math.abs(s) < 60) return t("justNow");
  if (Math.abs(s) < 3600) return r.format(Math.round(s / 60), "minute");
  if (Math.abs(s) < 86400) return r.format(Math.round(s / 3600), "hour");
  return r.format(Math.round(s / 86400), "day");
}
const kst = ms => fmt().abs.format(ms);

// 제목 언어 알아보기: 한글 → ko, 가나 → ja, 한자가 로마자보다 많으면 중국어(중국어 GDELT, 2026-09-27), 나머지 → en.
// 한자만 있는 일본 제목(財務省 "国債金利情報")은 일본식 한자로, 번체(대만·홍콩)는 번체 글자로 가림. 실제 제목 16개 중 15개 맞음.
const JA_KANJI = /令和|[県発済経気歳図対処広変円払売読駅様楽薬権観関覧産険転鉄総戦団営労働込]/;
const HANT = /[們個國會來時說對經過學發開關與為這後產實應體點當無從現區電視報導灣臺東車門長間問題錄風雲論壇係濟]/;
function srcLang(s) {
  if (/[가-힣]/.test(s)) return "ko";
  if (/[぀-ゟァ-ヺ]/.test(s)) return "ja";                         // 가나 ("・" "ー" 는 중국어 제목에도 쓰여서 뺌)
  if ((s.match(/[一-鿿]/g) || []).length <= (s.match(/[A-Za-z]+/g) || []).length) return "en";   // 한자 수 vs 영어 낱말 수 ("China-US port ties…-南海网" 은 영어, "苹果iPhone 17…销量" 은 중국어)
  return JA_KANJI.test(s) ? "ja" : HANT.test(s) ? "zh-Hant" : "zh";
}
const MM_CODE = { zh: "zh-CN", "zh-Hant": "zh-TW" };   // MyMemory 는 zh-CN·zh-TW (크롬 내장 번역은 zh·zh-Hant)

function translator(src, tgt) {
  const k = `${src}>${tgt}`;
  if (!translators.has(k)) translators.set(k, (async () => {
    const avail = await Promise.race([
      Translator.availability({ sourceLanguage: src, targetLanguage: tgt }),
      new Promise(r => setTimeout(() => r("timeout"), 10000)),
    ]);
    if (avail === "unavailable" || avail === "timeout") { notice(t("trUnsupported")); return null; }
    const tr = await Translator.create({ sourceLanguage: src, targetLanguage: tgt, monitor(m) {
      m.addEventListener("downloadprogress", e => notice(t("trDownloading", Math.round(e.loaded * 100))));
    } });
    notice("");
    return tr;
  })().catch(() => {
    // 번역 엔진을 처음 내려받을 땐 사용자가 한 번 눌러줘야 함(브라우저 규칙)
    translators.delete(k);
    notice(t("trNeedClick"), t("trClick"), () => { notice(""); translator(src, tgt).then(tr => tr && render()); });
    return null;
  }));
  return translators.get(k);
}

function translate(text, tgt) {
  const key = `${tgt}|${text}`;
  if (trCache.has(key)) return Promise.resolve(trCache.get(key));
  if (!trPending.has(key)) {
    const job = trChain.then(async () => {
      if (tgt !== LANG) return null;              // 그 사이 언어를 바꿨으면 건너뜀
      const tr = await translator(srcLang(text), tgt);
      if (!tr || tgt !== LANG) return null;
      const out = await tr.translate(text);
      trCache.set(key, out);
      return out;
    }).catch(() => null).finally(() => trPending.delete(key));
    trPending.set(key, job);
    trChain = job;                                // 한 번에 하나씩 차례로
  }
  return trPending.get(key);
}

// ── 더 매끄러운 번역: MyMemory(무료, 하루 5,000자) + DB 저장(PC·휴대폰 같이 재사용) ──────
const good = new Map();          // "ko|원문" → MyMemory 번역 (DB에 저장된 것 포함)
const dbWait = new Map();        // DB 조회 대기 (0.15초 모아서 한 번에)
const absent = new Set();        // DB에 없다고 확인된 것 (이번 접속 동안 다시 묻지 않음)
let dbTimer = null, mmChain = Promise.resolve();
const mmKey = () => `mmUsed:${new Date().toISOString().slice(0, 10)}`;   // 오늘(세계 표준시) 쓴 글자 수

function fromDb(text, tgt) {
  const key = `${tgt}|${text}`;
  if (good.has(key)) return Promise.resolve(good.get(key));
  if (absent.has(key)) return Promise.resolve(null);
  return new Promise(res => {
    if (!dbWait.has(key)) dbWait.set(key, []);
    dbWait.get(key).push(res);
    clearTimeout(dbTimer);
    dbTimer = setTimeout(flushDb, 150);
  });
}
async function flushDb() {
  const batch = [...dbWait.entries()];
  dbWait.clear();
  const byLang = {};
  for (const [key] of batch) { const i = key.indexOf("|"); (byLang[key.slice(0, i)] ||= []).push(key.slice(i + 1)); }
  for (const [lang, srcs] of Object.entries(byLang)) {
    for (let i = 0; i < srcs.length; i += 25) {
      try {
        const { data } = await db.from("translations").select("src,out").eq("lang", lang).in("src", srcs.slice(i, i + 25));
        for (const r of data || []) good.set(`${lang}|${r.src}`, r.out);
      } catch { /* 조회 실패면 다른 번역으로 */ }
    }
  }
  for (const [key, list] of batch) { if (!good.has(key)) absent.add(key); list.forEach(res => res(good.get(key) || null)); }
}

// MyMemory 한 문장 번역 (한 번에 하나씩, 하루 한도 안에서만)
function myMemory(text, src, tgt) {
  const job = mmChain.then(async () => {
    const used = local.get(mmKey(), 0);
    if (used + text.length > MM_DAILY) return null;
    local.set(mmKey(), used + text.length);
    const r = await fetch(`${MM_URL}?q=${encodeURIComponent(text)}&langpair=${MM_CODE[src] || src}|${tgt}`).then(x => x.json()).catch(() => null);
    const out = r?.responseData?.translatedText;
    if (!out || r.responseStatus !== 200 || r.quotaFinished || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID LANGUAGE/i.test(out)) {
      if (r?.quotaFinished || /MYMEMORY WARNING/i.test(out || "")) local.set(mmKey(), MM_DAILY);   // 오늘 한도 끝
      return null;
    }
    const ta = document.createElement("textarea");   // &#39; 같은 표기를 글자로 (실행되지 않는 안전한 방법)
    ta.innerHTML = out;
    return ta.value.trim() || null;
  });
  mmChain = job.catch(() => null);
  return job;
}

// 가장 좋은 번역: DB에 저장된 것 → (중요한 제목이면) MyMemory → 크롬 내장 번역
async function better(text, tgt, priority) {
  const key = `${tgt}|${text}`;
  let out = await fromDb(text, tgt);
  if (out) return out;
  if (priority) {
    out = await myMemory(text, srcLang(text), tgt);
    if (out) {
      good.set(key, out);
      db.from("translations").insert({ src: text, lang: tgt, out }).then(() => {}, () => {});   // 다음부터는 한도 안 씀
      return out;
    }
  }
  return canTranslate ? translate(text, tgt) : null;
}

// 외부에서 온 글은 반드시 textContent로 넣음. 선택한 언어와 다르면 번역해서 바꿔 끼움.
// priority: 속보 띠·팝업·목록 위쪽처럼 중요한 제목 → MyMemory(더 매끄러움) 우선
function setText(node, text, origNode, priority = false) {
  node.textContent = text;
  const src = srcLang(text);
  node.lang = src;
  if (src === LANG || !text) return;
  const show = out => {
    if (!out) return;
    node.textContent = out; node.lang = LANG; node.title = text;
    if (origNode) { origNode.textContent = `${t("original")}: ${text}`; origNode.lang = src; origNode.hidden = false; }
  };
  const key = `${LANG}|${text}`;
  if (good.has(key)) return show(good.get(key));
  if (trCache.has(key)) show(trCache.get(key));          // 크롬 번역이 있으면 먼저 보여주고
  const want = LANG;
  better(text, want, priority).then(out => want === LANG && show(out));   // 더 좋은 번역이 오면 바꿈
}

function notice(text, btnText, onBtn) {
  const box = $("notice");
  if (!text || noticeClosed) { box.hidden = true; return; }
  $("noticeText").textContent = text;
  const btn = $("noticeBtn");
  btn.hidden = !btnText;
  if (btnText) { btn.textContent = btnText; btn.onclick = onBtn; }
  box.hidden = false;
}
$("noticeClose").addEventListener("click", () => { noticeClosed = true; $("notice").hidden = true; });

// 화면 글자·언어 탭
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = t("appName");
  for (const e of document.querySelectorAll("[data-i18n]")) e.textContent = t(e.dataset.i18n);
  for (const e of document.querySelectorAll("[data-i18n-ph]")) { e.placeholder = t(e.dataset.i18nPh); e.setAttribute("aria-label", t(e.dataset.i18nPh)); }
  for (const e of document.querySelectorAll("[data-i18n-title]")) { e.title = t(e.dataset.i18nTitle); e.setAttribute("aria-label", t(e.dataset.i18nTitle)); }
  for (const e of document.querySelectorAll("[data-i18n-aria]")) e.setAttribute("aria-label", t(e.dataset.i18nAria));
  for (const box of document.querySelectorAll(".langs")) {
    box.replaceChildren(...Object.entries(LANGS).map(([code, name]) => {
      const b = el("button", null, name);
      b.type = "button"; b.lang = code;
      b.setAttribute("aria-pressed", String(code === LANG));
      b.addEventListener("click", () => setLang(code));
      return b;
    }));
  }
  renderRegions();
}

function setLang(code) {
  if (code === LANG) return;
  LANG = code;
  local.set("lang", code);
  noticeClosed = false;
  notice("");
  if (canTranslate && code !== "en") translator("en", code);   // 누른 순간 바로 준비 시작(브라우저 규칙상 클릭 직후여야 함)
  else if (!canTranslate && code !== "en") notice(t("trNoApi"));
  applyStatic();
  setMapLabels();
  popup?.remove();
  stamp(false);
  if (items.length) render();
  else if (!$("app").hidden) load();   // 비어 있거나 오류 안내도 새 언어로 다시
  renderMarket();
}

// ── 로그인 ───────────────────────────────────────────────────────────
db.auth.onAuthStateChange((_event, session) => {
  // 이 콜백 안에서 바로 DB를 부르면 멈출 수 있어서 한 박자 뒤에 실행
  setTimeout(() => (session ? showApp() : showLogin()), 0);
});

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  const btn = e.submitter; btn.disabled = true;
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  btn.disabled = false;
  if (error) $("loginErr").textContent = /invalid/i.test(error.message) ? t("badLogin") : error.message;
});
$("logout").addEventListener("click", () => db.auth.signOut());

function showLogin() {
  clearInterval(timer);
  $("app").hidden = true; $("login").hidden = false;
}

function showApp() {
  if (!$("app").hidden) return;
  $("login").hidden = true; $("app").hidden = false;
  if (!map) initMap(); else map.resize();
  if (canTranslate && LANG !== "en") translator("en", LANG);
  else if (!canTranslate && LANG !== "en") notice(t("trNoApi"));
  load();
  loadMarket();
  clearInterval(timer);
  timer = setInterval(() => { if (document.visibilityState === "visible") { refresh(); loadMarket(); } }, REFRESH_MIN * 60e3);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { local.set("lastVisit", new Date().toISOString()); return; }
  // 휴대폰에서 다시 켰을 때: 그 사이 들어온 것만 NEW, 바로 새 소식 확인
  prevVisit = Date.parse(local.get("lastVisit", "")) || prevVisit;
  if (!$("app").hidden) { if (map) refresh(); loadMarket(); }
});

// ── 지도 (지구본) ─────────────────────────────────────────────────────
const zoomFor = key => REGIONS[key].zoom - (isPhone() ? 0.9 : 0);   // 휴대폰은 화면이 좁아서 조금 더 멀리서

function initMap() {
  try {
    map = new maplibregl.Map({
      container: "map", style: MAP_STYLE, center: REGIONS[region].center, zoom: zoomFor(region),
      minZoom: 0, maxZoom: 12,             // 기사 위치는 도시·나라 단위라 더 확대해도 의미 없음
      // 출처 표기(각 기관 이용 조건). ⓘ 버튼을 누르면 펼쳐짐
      attributionControl: { compact: true, customAttribution: [
        "뉴스·데이터: GDELT", "USGS", "EMSC-CSEM", "出典：気象庁ホームページ（加工して作成）", "BMKG", "NOAA NTWC/PTWC", "GDACS",
        "Federal Reserve", "ECB", "日本銀行", "US Treasury OFAC", "The White House", "US Dept of State", "© European Union", "Council of the EU",
        "財務省", "首相官邸", "외교부", "재정경제부", "DART", "연합뉴스", "뉴시스", "시·도청·시청 보도자료(공공누리)", "BERNAMA", "Reuters·Bloomberg·CNBC·AFP (Bluesky)",
        "시세: ECB · U.S. Treasury · U.S. EIA · 빗썸 · 우리은행 금·은 고시가격 · KRX 금 시세(금융위원회 공공데이터, 공공누리 4유형)",
        "위성사진: NASA EOSDIS GIBS (Blue Marble)", "번역: MyMemory · 크롬 내장 번역",
      ] },
      dragRotate: false, pitchWithRotate: false, touchPitch: false,   // 지구본은 돌리기만, 기울이지 않게
    });
  } catch {
    notice(t("noWebGL"));
    return;
  }
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  map.addControl(new maplibregl.GlobeControl(), "top-right");   // 지구본 ↔ 평면 지도 전환 버튼

  // 출처 표기는 처음엔 접어 두기(ⓘ를 누르면 펼쳐짐) — 긴 목록이 지도를 가리지 않게
  map.once("load", () => document.querySelector(".maplibregl-ctrl-attrib")?.classList.remove("maplibregl-compact-show"));
  map.on("style.load", () => {
    map.setProjection({ type: "globe" });
    addGlobeImagery();
    setMapLabels();
    addNewsLayers();
    if (items.length) render();
  });

  // 점·묶음 누르기 (손가락으로 누르기 쉽게 주변 10px까지 인정)
  const hit = p => map.queryRenderedFeatures([[p.x - 10, p.y - 10], [p.x + 10, p.y + 10]], { layers: ["clusters", "points"] })[0];
  map.on("click", e => {
    const f = hit(e.point);
    if (!f) return;
    if (f.properties.cluster) openCluster(f);
    else openItem(drawn[f.properties.i], false);
  });
  map.on("mousemove", e => { map.getCanvas().style.cursor = hit(e.point) ? "pointer" : ""; });
}

// 실제 지구 색: 멀리서는 NASA 위성사진(Blue Marble), 가까이 가면 색 지도로 자연스럽게 바뀜
function addGlobeImagery() {
  if (map.getSource("bluemarble")) return;
  map.addSource("bluemarble", { type: "raster", tiles: [BLUE_MARBLE], tileSize: 256, maxzoom: 8 });
  const layers = map.getStyle().layers;
  // 바탕색·기본 지형 음영(흰색) 위, 땅·물·도로 아래에 깔기 (지형 음영이 위성사진을 덮지 않게)
  const firstVector = layers.find(l => l.type !== "background" && l.type !== "raster")?.id;
  map.addLayer({ id: "bluemarble", type: "raster", source: "bluemarble",
    paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], 5, 1, 7, 0], "raster-fade-duration": 0 } }, firstVector);
  // 땅·물·공원 같은 면 칠하기는 가까이(6단계부터)에서만 → 멀리서는 위성사진 색이 보임
  for (const l of layers) if (l.type === "fill" && (l.minzoom ?? 0) < 6) map.setLayerZoomRange(l.id, 6, l.maxzoom ?? 24);
  // 지구본 둘레의 푸른 대기 빛
  try {
    map.setSky({ "sky-color": "#04070f", "horizon-color": "#1d4f91", "fog-color": "#1d4f91",
      "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 1, 5, 1, 7, 0] });
  } catch { /* 지원 안 하는 기기면 생략 */ }
}

// 지도 속 지명을 선택한 언어로 (없으면 영어 → 원래 이름)
// 긴 공식 이름 대신 부르는 이름 (영어 이름으로 찾음). 사용자 요청 2026-09-27: 조선민주주의인민공화국 → 북한
const SHORT_NAMES = { ko: { "North Korea": "북한" } };
let labelLayers = null;
function setMapLabels() {
  if (!map?.getStyle()) return;   // 지도 모양 정보가 아직 없으면 나중에 (style.load 때 다시 불림)
  labelLayers ??= map.getStyle().layers
    .filter(l => JSON.stringify(l.layout?.["text-field"] ?? "").includes('"name'))
    .map(l => l.id);
  let expr = ["coalesce", ["get", `name:${LANG}`], ...(LANG === "en" ? [] : [["get", "name:en"]]), ["get", "name:latin"], ["get", "name"]];
  const short = Object.entries(SHORT_NAMES[LANG] || {}).flat();
  if (short.length) expr = ["match", ["get", "name:en"], ...short, expr];
  for (const id of labelLayers) if (map.getLayer(id)) map.setLayoutProperty(id, "text-field", expr);
}

function addNewsLayers() {
  if (map.getSource("news")) return;
  const cats = Object.keys(CAT_COLORS);
  for (const c of Object.keys(ICONS)) if (!map.hasImage(`ic-${c}`)) map.addImage(`ic-${c}`, iconImage(ICONS[c]), { pixelRatio: 2 });
  // 묶음 안의 분야별 건수를 세어서, 가장 많은 분야 색으로 테두리
  const clusterProperties = Object.fromEntries(cats.map(c => [c, ["+", ["case", ["==", ["get", "c"], c], 1, 0]]]));
  // 묶음 안에서 가장 많은 분야 → 그 분야의 값(색·투명도·아이콘 이름)을 고르는 식
  const dominantOf = val => {
    const e = ["case"];
    cats.forEach((c, i) => {
      const rest = cats.slice(i + 1);
      if (!rest.length) return e.push(val(c));
      e.push([">=", ["get", c], rest.length === 1 ? ["get", rest[0]] : ["max", ...rest.map(r => ["get", r])]], val(c));
    });
    return e;
  };
  map.addSource("news", { type: "geojson", data: { type: "FeatureCollection", features: [] },
    cluster: true, clusterRadius: 45, clusterMaxZoom: CLUSTER_MAX_ZOOM, clusterProperties });
  map.addLayer({ id: "clusters", type: "circle", source: "news", filter: ["has", "point_count"], paint: {
    "circle-color": dominantOf(c => CAT_COLORS[c]), "circle-opacity": dominantOf(c => CAT_OPACITY[c] ?? 1),
    "circle-stroke-color": "#ffffff", "circle-stroke-width": 2,
    "circle-radius": ["step", ["get", "point_count"], 14, 10, 17, 100, 20],
  } });
  map.addLayer({ id: "cluster-icons", type: "symbol", source: "news", filter: ["has", "point_count"], layout: {
    "icon-image": dominantOf(c => (ICONS[c] ? `ic-${c}` : "")), "icon-size": ["step", ["get", "point_count"], 1.1, 10, 1.3, 100, 1.5],
    "icon-allow-overlap": true, "icon-ignore-placement": true,
  } });
  // 건수는 동그라미 오른쪽 아래에 작은 글씨로
  map.addLayer({ id: "cluster-count", type: "symbol", source: "news", filter: ["has", "point_count"], layout: {
    "text-field": ["get", "point_count_abbreviated"], "text-font": ["Noto Sans Bold"], "text-size": 11, "text-allow-overlap": true,
    "text-ignore-placement": true, "text-anchor": "top-left", "text-offset": ["step", ["get", "point_count"], ["literal", [0.7, 0.4]], 10, ["literal", [0.95, 0.6]], 100, ["literal", [1.2, 0.8]]],
  }, paint: { "text-color": "#ffffff", "text-halo-color": "#0b0f17", "text-halo-width": 2.5 } });
  const withIcon = Object.keys(ICONS);
  map.addLayer({ id: "points", type: "circle", source: "news", filter: ["!", ["has", "point_count"]], paint: {
    "circle-color": ["match", ["get", "c"], ...cats.flatMap(c => [c, CAT_COLORS[c]]), CAT_COLORS.general],
    "circle-opacity": ["match", ["get", "c"], ...Object.entries(CAT_OPACITY).flat(), 1],
    // 아이콘이 들어가는 분야는 크게, 한국·기타는 작은 점
    "circle-radius": ["match", ["get", "c"], withIcon, ["case", ["get", "o"], 12, 10.5], ["case", ["get", "o"], 7, 5.5]],

// 흰색 아이콘 그림 (지도에 올릴 이미지). 28px 그림을 2배 선명도로 → 화면에선 14px
function iconImage({ d, fill }) {
  const size = 28, c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.translate(2, 2); g.scale((size - 4) / 24, (size - 4) / 24);
  g.strokeStyle = g.fillStyle = "#ffffff"; g.lineWidth = 2.4; g.lineCap = g.lineJoin = "round";
  const path = new Path2D(d);
  fill ? g.fill(path) : g.stroke(path);
  return g.getImageData(0, 0, size, size);
}
// 범례·목록용 작은 아이콘 (분야 색 동그라미 + 흰 아이콘)
function catIcon(cat, px = 16) {
  const NS = "http://www.w3.org/2000/svg", mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = mk("svg", { viewBox: "0 0 24 24", width: px, height: px, "aria-hidden": "true", class: "cat-ic" });
  svg.append(mk("circle", { cx: 12, cy: 12, r: 12, fill: CAT_COLORS[cat], "fill-opacity": CAT_OPACITY[cat] ?? 1 }));
  const ic = ICONS[cat];
  if (ic) svg.append(mk("path", { d: ic.d, transform: "translate(5 5) scale(0.583)", fill: ic.fill ? "#fff" : "none",
    stroke: ic.fill ? "none" : "#fff", "stroke-width": 2.6, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  return svg;
}

async function openCluster(f) {
  const src = map.getSource("news"), id = f.properties.cluster_id;
  const z = await src.getClusterExpansionZoom(id);
  if (z <= CLUSTER_MAX_ZOOM && z > map.getZoom()) { map.easeTo({ center: f.geometry.coordinates, zoom: z }); return; }
  const leaves = await src.getClusterLeaves(id, f.properties.point_count, 0);
  pinned = leaves.map(l => drawn[l.properties.i]).filter(Boolean).sort((a, b) => b._t - a._t);
  renderList();
  if (isPhone()) $("side").scrollIntoView({ behavior: "smooth" });
}

function openItem(it, move) {
  if (!it) return;
  if (!hasCoords(it)) { if (/^https?:\/\//i.test(it.url)) window.open(it.url, "_blank", "noopener,noreferrer"); return; }

// ── 소식 카드 ────────────────────────────────────────────────────────
function el(tag, cls, text) {

function card(it, inPopup, priority = false) {

// ── 불러오기 ─────────────────────────────────────────────────────────
async function fetchRows(query, cap) {
  const rows = [];
  for (let from = 0; from < cap; from += PAGE) {
    const { data, error } = await query().range(from, Math.min(from + PAGE, cap) - 1);
    if (error) throw error;
    rows.push(...data);
    if (data.length < PAGE) break;
  }
  return rows;
}
const sinceIso = () => new Date(Date.now() - Number($("range").value) * 3600e3).toISOString();

async function load() {
  const seq = ++loadSeq, since = sinceIso();
  // 같은 시각인 기사가 많아서, id까지 순서에 넣어야 나눠 받을 때 빠지거나 겹치지 않음
  const base = () => db.from("news").select(COLS).gte("published_at", since)
    .order("published_at", { ascending: false }).order("id", { ascending: false });
  $("refresh").disabled = true;
  if (!items.length) $("count").textContent = t("loading");
  try {
    // 한국 소식은 따로 받아서, 세계 뉴스가 많아 한도에 걸려도 빠지지 않게 함
    const [news, official, korea] = await Promise.all([
      fetchRows(() => base().neq("source_type", "official"), NEWS_CAP),
      fetchRows(() => base().eq("source_type", "official"), 5000),
      fetchRows(() => base().neq("source_type", "official").in("country", ["South Korea", "North Korea"]), 5000),
    ]);
    if (seq !== loadSeq) return;                  // 그 사이 기간을 바꿔 새로 불렀으면 이 결과는 버림
    const seen = new Set();
    items = [...official, ...korea, ...news].filter(it => !seen.has(it.url) && seen.add(it.url)).map(prep).sort((a, b) => b._t - a._t);
    capped = news.length >= NEWS_CAP;
    oldestNews = news.length ? Date.parse(news[news.length - 1].published_at) : null;
    fullAt = Date.now();
    stamp();
    render();
  } catch (err) {
    if (seq !== loadSeq) return;
    if (err?.status === 401 || /JWT|token/i.test(err?.message || "")) return db.auth.signOut();
    $("count").textContent = t("loadFail");
    $("list").replaceChildren(el("li", "empty", t("retry", err?.message || String(err))));
  } finally {
    if (seq === loadSeq) $("refresh").disabled = false;
  }
}

// 새로 들어온 소식만 받아서 붙임 (데이터를 적게 쓰고, 보던 팝업도 그대로)
async function refresh() {
  if (!items.length || Date.now() - fullAt > FULL_RELOAD_MIN * 60e3) return load();
  const seq = loadSeq, since = sinceIso();
  // +1ms: DB 시각은 마이크로초까지라, 그냥 비교하면 마지막 묶음을 매번 다시 받아옴
  const newest = new Date(items.reduce((m, it) => Math.max(m, it._c), 0) + 1).toISOString();
  try {
    const rows = await fetchRows(() => db.from("news").select(COLS).gt("collected_at", newest).gte("published_at", since)
      .order("collected_at", { ascending: false }).order("id", { ascending: false }), 5000);
    if (seq !== loadSeq) return;
    const cutoff = Date.parse(since);
    const byUrl = new Map(items.map(it => [it.url, it]));
    const fresh = rows.filter(r => !byUrl.has(r.url));   // 정말 처음 보는 소식만
    for (const r of fresh) byUrl.set(r.url, prep(r));
    const before = items.length;
    items = [...byUrl.values()].filter(it => it._t >= cutoff).sort((a, b) => b._t - a._t);
    stamp();
    if (fresh.length || items.length !== before) render();   // 바뀐 게 없으면 화면을 건드리지 않음(목록 위치 유지)
  } catch { /* 다음 차례에 다시 시도 */ }
}
let stampAt = 0;   // 마지막으로 받아온 시각 (언어를 바꾸면 같은 시각을 새 언어로 다시 표시)
const stamp = (fresh = true) => { if (fresh) stampAt = Date.now(); $("updated").textContent = stampAt ? t("asOf", kst(stampAt)) : ""; };

// ── 그리기 ───────────────────────────────────────────────────────────
function filtered() {
  const q = $("q").value.trim().toLowerCase();
  return items.filter(it => {
    if (hiddenCats.has(catOf(it)) || hiddenTypes.has(it.source_type)) return false;
    if (!q) return true;
    const tr = good.get(`${LANG}|${it.title}`) || trCache.get(`${LANG}|${it.title}`) || "";
    return `${it.title} ${tr} ${it.country || ""} ${it.location_name || ""} ${it.source_name}`.toLowerCase().includes(q);
  });
}

function render() {
  const shown = filtered();
  drawn = shown.filter(it => hasCoords(it) && catOf(it) !== "general");   // 지도에는 5가지 분야만(기타는 목록에만)
  const src = map?.getSource("news");
  if (src) src.setData({ type: "FeatureCollection", features: drawn.map((it, i) => ({
    type: "Feature", geometry: { type: "Point", coordinates: [it.longitude, it.latitude] },
    properties: { i, c: catOf(it), o: it.source_type === "official", n: !!isNew(it) },
  })) });
  if (pinned) { const byUrl = new Map(items.map(it => [it.url, it])); pinned = pinned.map(p => byUrl.get(p.url)).filter(Boolean); }
  renderLegend();
  renderTicker(shown);
  renderRegions(regionCounts(shown));
  renderList(shown);
}

function renderList(all = filtered()) {
  const ok = new Set(all);   // "이 지점 소식" 목록에도 분야·검색 필터를 똑같이 적용
  const shown = pinned ? pinned.filter(it => ok.has(it)) : all.filter(it => inRegion(it, region));
  const newCount = all.filter(isNew).length;
  $("count").textContent = t("count", T[LANG].regions[region], shown.length.toLocaleString(), all.length.toLocaleString(), newCount ? newCount.toLocaleString() : "")
    + (capped && oldestNews ? t("capped", kst(oldestNews)) : "");
  $("pinbar").hidden = !pinned;
  if (pinned) $("pinText").textContent = t("pinned", shown.length.toLocaleString());
  const list = $("list");
  if (!shown.length) {
    list.replaceChildren(el("li", "empty", items.length ? t("emptyArea") : t("emptyAll")));
    return;
  }
  const lis = shown.slice(0, LIST_MAX).map((it, i) => {
    const li = el("li"), btn = li.appendChild(el("button"));
    btn.type = "button";
    btn.appendChild(card(it, false, i < 20));   // 목록 위쪽 20개는 더 좋은 번역
    btn.addEventListener("click", () => openItem(it, true));
    return li;
  });
  if (shown.length > LIST_MAX) lis.push(el("li", "more", t("more", (shown.length - LIST_MAX).toLocaleString())));
  list.replaceChildren(...lis);
  list.scrollTop = 0;   // 목록이 바뀌면 맨 위부터
}
$("unpin").addEventListener("click", () => { pinned = null; renderList(); });

// 속보 띠: 공식 발표·통신사 소식 최신 15건 (없으면 전체에서)
function renderTicker(pool) {
  let top = pool.filter(it => it.source_type === "official" || it.source_type === "wire").slice(0, 15);
  if (!top.length) top = pool.slice(0, 15);
  const make = () => top.map(it => {

    setText(b.appendChild(el("span")), it.title, null, true);
    b.append(` · ${ago(it._t)}`);
    b.addEventListener("click", () => openItem(it, true));
    return b;
  });
  const inner = $("tickerInner");
  inner.replaceChildren(...make(), ...make());   // 두 번 이어 붙여 끊김 없이 흐르게
  inner.style.setProperty("--dur", `${Math.max(30, top.length * 7)}s`);

function renderLegend() {
  const box = $("legend");
  const counts = {}, typeCounts = {};
  for (const it of items) { counts[catOf(it)] = (counts[catOf(it)] || 0) + 1; typeCounts[it.source_type] = (typeCounts[it.source_type] || 0) + 1; }
  const toggle = (set, key, storeKey) => () => {

  for (const key of LEGEND_CATS) {                     // 한국·기타·출처 종류 버튼은 잠시 뺌(사용자 요청)

    const b = el("button"); b.type = "button";

    b.addEventListener("click", toggle(hiddenCats, key, "hiddenCats"));

  }
  for (const key of []) {                                 // (출처 종류 버튼: 잠시 뺌 — 되살리려면 TYPE_KEYS 로)
    if (!typeCounts[key]) continue;

    b.setAttribute("aria-pressed", String(!hiddenTypes.has(key)));
    b.append(T[LANG].types[key], el("small", null, typeCounts[key].toLocaleString()));
    b.addEventListener("click", toggle(hiddenTypes, key, "hiddenTypes"));
    typeRow.appendChild(b);
  }
  box.replaceChildren(catRow, typeRow);
}

};

const dayText = ms => new Intl.DateTimeFormat(LOCALE[LANG], { timeZone: "Asia/Seoul", month: "numeric", day: "numeric" }).format(ms);

// 전일 대비: 금리(%)는 %p 차이, 나머지는 % 변화. ▲▼ 기호를 늘 같이 (색만으로 구분하지 않게)
function delta(r) {
  if (r.prev_close == null) return null;
  const diff = r.value - r.prev_close, sign = diff > 0 ? "▲" : diff < 0 ? "▼" : "–";
  const txt = r.unit === "%" ? `${sign} ${Math.abs(diff).toFixed(2)}%p` : `${sign} ${Math.abs(r.change_pct ?? 0).toFixed(2)}%`;
  return { dir: diff > 0 ? "up" : diff < 0 ? "down" : "flat", txt };
}

    const [l, d, h] = await Promise.all([
      db.from("latest_prices").select("*"),
      db.from("price_derived").select("*").maybeSingle(),
      fetchRows(() => db.from("price_daily").select("symbol,ts,value").gte("ts", since).order("symbol").order("ts"), 5000),
    ]);
    if (l.error) throw l.error;
    const daily = new Map();
    for (const r of h) (daily.get(r.symbol) || daily.set(r.symbol, []).get(r.symbol)).push({ t: Date.parse(r.ts), v: +r.value });
    const latest = new Map(l.data.map(r => [r.symbol, { ...r, value: +r.value, _t: Date.parse(r.ts),
      prev_close: r.prev_close == null ? null : +r.prev_close, change_pct: r.change_pct == null ? null : +r.change_pct }]));
    market = { latest, daily, derived: d.data };
    renderMarket();
  } catch {
    if (!market) $("market").replaceChildren(el("p", "empty", t("mFail")));   // 시세를 못 받아도 뉴스는 그대로
  }
}

function renderMarket() {
  if (!market) return;
  const gold = market.latest.has("KRXGOLD") ? "KRXGOLD" : "XAUTKRW";
  $("mstrip").replaceChildren(...STRIP.map(s => (s === "GOLD" ? gold : s)).filter(s => market.latest.has(s)).map(s => {
    const r = market.latest.get(s), dl = delta(r), b = el("button");
    b.type = "button";
    b.append(el("span", "n", SYM[s][li()]));
    if (GOLD.has(s)) {                                   // 금: 1g · 1돈 같이
      const g = perGram(r);
      b.append(el("span", "v", `1g ${nf(g, "KRW")}`), el("span", "n", "·"), el("span", "v", `${t("mDonShort")} ${nf(g * 3.75, "KRW")}`));
    } else b.append(el("span", "v", nf(r.value, r.unit)));
    if (dl) b.append(el("span", dl.dir, dl.txt));
    b.addEventListener("click", () => showTab("market", s));
    return b;
  }));
  if (!market.latest.size) return $("market").replaceChildren(el("p", "empty", t("mEmpty")));
  const parts = [];
  for (const [g, syms] of MGROUPS) {
    if (g === "bank") {
      const tiles = PAIRS.filter(pr => market.latest.has(pr.buy) && market.latest.has(pr.sell)).map(pairTile);
      if (tiles.length) { const grid = el("div", "tiles"); grid.append(...tiles); parts.push(el("h3", null, T[LANG].mGroups.bank), grid); }
      continue;
    }
    const have = syms.filter(s => market.latest.has(s));
    if (!have.length) continue;
    const grid = el("div", "tiles");
    grid.append(...have.map(s => tile(market.latest.get(s))));
    parts.push(el("h3", null, T[LANG].mGroups[g]), grid);
  }
  const dv = market.derived;
  if (dv) {
    const grid = el("div", "tiles"), gAsOf = dv.gold_ts ? t("mAsOf", whenText(Date.parse(dv.gold_ts))) : "";
    const prem = +dv.usdt_premium_pct;
    grid.append(simpleTile(t("mTether"), `${prem > 0 ? "+" : ""}${nf(prem, "%")}%`, t("mTetherSub")));
    if (dv.gold_token_usd_per_oz != null) grid.append(simpleTile(t("mGoldUsd"), `$${nf(+dv.gold_token_usd_per_oz, "USD")}`, `XAUT ÷ USDT · ${gAsOf}`));
    parts.push(el("h3", null, T[LANG].mGroups.derived), grid);
  }
  parts.push(el("p", "mnote", t("mNote")));
  $("market").replaceChildren(...parts);
}

function tile(r) {
  const box = el("article", "tile");
  box.id = `px-${r.symbol}`;
  box.append(el("div", "lbl", SYM[r.symbol]?.[li()] ?? r.name_ko));
  if (GOLD.has(r.symbol)) {
    const g = perGram(r), won = UNITS.KRW[li()];
    for (const [k, v] of [["1g", g], [t("mDonShort"), g * 3.75]]) {
      const line = box.appendChild(el("div", "val"));
      line.append(el("small", "k", k), nf(v, "KRW"), el("small", null, won));
    }
    if (r.symbol === "XAUTKRW") box.append(el("div", "asof", `${t("mOz")} ${nf(r.value, "KRW")}${won}`));
  } else {
    const val = box.appendChild(el("div", "val", nf(r.value, r.unit)));
    const unit = UNITS[r.unit]?.[li()];
    if (unit) val.appendChild(el("small", null, unit));
  }
  const dl = delta(r);
  box.append(el("div", `dlt ${dl ? dl.dir : "flat"}`, dl ? `${dl.txt} ${t("mPrev")}` : t("mNoPrev")));
  box.append(el("div", "asof", `${t("mAsOf", whenText(r._t))} · ${LIVE.has(r.symbol) ? t("mLive") : t("mDaily")} · ${SRC[r.source]?.[li()] ?? r.source}`));
  const pts = market.daily.get(r.symbol) || [];
  if (pts.length >= 2) box.append(spark(pts, r.unit, box));
  return box;
}
// 살 때 / 팔 때 한 장: 1g·1돈으로 환산해 두 줄로. 전일 대비·추세선은 살 때 기준
function pairTile(pr) {
  const b = market.latest.get(pr.buy), s = market.latest.get(pr.sell), won = UNITS.KRW[li()];
  const perG = (v, buy) => v / pr.grams * (buy && pr.vat ? 1.1 : 1);
  const int = v => `${new Intl.NumberFormat(LOCALE[LANG], { maximumFractionDigits: 0 }).format(v)}${won}`;
  const box = el("article", "tile wide");
  box.id = `px-${pr.buy}`;
  box.append(el("div", "lbl", T[LANG].mPair[pr.key]));
  const table = box.appendChild(el("table", "pt")), head = table.createTHead().insertRow();
  for (const h of ["", "1g", t("mDon")]) head.appendChild(el("th", null, h));
  for (const [r, tag, buy] of [[b, t("mBuy"), true], [s, t("mSell"), false]]) {
    const g = perG(r.value, buy), row = table.insertRow();
    row.insertCell().appendChild(el("span", `tag${buy ? " buy" : ""}`, tag));
    row.insertCell().textContent = int(g);
    row.insertCell().textContent = int(g * 3.75);
  }
  const dl = delta(b);
  box.append(el("div", `dlt ${dl ? dl.dir : "flat"}`, dl ? `${dl.txt} ${t("mPrev")} (${t("mBuy")})` : t("mNoPrev")));
  box.append(el("div", "asof", `${t("mAsOf", whenText(b._t))} · ${t("mBankPost")} · ${SRC[b.source]?.[li()] ?? b.source} · ${pr.vat ? t("mVatIn") : t("mNoVat")}`));
  const pts = (market.daily.get(pr.buy) || []).map(q => ({ t: q.t, v: perG(q.v, true) }));
  if (pts.length >= 2) box.append(spark(pts, "KRW", box));
  return box;
}
function simpleTile(label, value, sub) {
  const box = el("article", "tile");
  box.append(el("div", "lbl", label), el("div", "val", value), el("div", "asof", sub));
  return box;
}

// 추세선(최근 약 90일, 하루 마지막 값). 선은 흐린 색, 마지막 값만 강조. 손가락·마우스를 올리면 그날 값
function spark(pts, unit, box) {
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1, last = pts.length - 1;
  const X = i => (i / last) * 100, Y = v => 28 - ((v - lo) / span) * 26;
  const line = { fill: "none", "vector-effect": "non-scaling-stroke", "stroke-linecap": "round", "stroke-linejoin": "round" };
  const dotAt = i => `M${X(i)} ${Y(pts[i].v)}l0 0`;   // 길이 0 선 + 둥근 끝 = 늘어나지 않는 점
  const svg = mk("svg", { viewBox: "0 0 100 30", preserveAspectRatio: "none", role: "img",
    "aria-label": t("mTrend", pts.length, nf(lo, unit), nf(hi, unit)) });
  const cross = mk("path", { ...line, stroke: "var(--text)", "stroke-width": 1, opacity: 0.4, visibility: "hidden" });
  const dot = mk("path", { ...line, stroke: "var(--text)", "stroke-width": 7, visibility: "hidden" });
  svg.append(mk("path", { ...line, d: pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(2)} ${Y(p.v).toFixed(2)}`).join(""),
    stroke: "var(--muted)", "stroke-width": 1.5 }), mk("path", { ...line, d: dotAt(last), stroke: "var(--accent)", "stroke-width": 7 }), cross, dot);
  const tip = box.appendChild(el("div", "tip"));
  tip.hidden = true;
  svg.addEventListener("pointermove", e => {
    const rect = svg.getBoundingClientRect();
    const i = Math.round(Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)) * last);
    cross.setAttribute("d", `M${X(i)} 0V30`); dot.setAttribute("d", dotAt(i));
    cross.setAttribute("visibility", "visible"); dot.setAttribute("visibility", "visible");
    tip.textContent = `${dayText(pts[i].t)} · ${nf(pts[i].v, unit)}`; tip.hidden = false;
  });
  svg.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.hidden = true; });
  return svg;
}

// 옆 칸 탭: 뉴스 ↔ 시세 (마지막으로 본 탭 기억). 위쪽 띠를 누르면 그 품목 카드로
function showTab(tab, symbol) {
  $("side").dataset.tab = tab;
  local.set("sideTab", tab);
  $("tabNews").setAttribute("aria-selected", String(tab !== "market"));
  $("tabMarket").setAttribute("aria-selected", String(tab === "market"));
  const card = symbol && $(`px-${symbol}`);
  if (card) {
    card.scrollIntoView({ block: "center", behavior: "smooth" });
    card.classList.add("flash");
    setTimeout(() => card.classList.remove("flash"), 1600);
  }
}
$("tabNews").addEventListener("click", () => showTab("news"));
$("tabMarket").addEventListener("click", () => showTab("market"));
showTab(local.get("sideTab", "news") === "market" ? "market" : "news");

// ── 조작 ─────────────────────────────────────────────────────────────
let typing;
$("q").addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(render, 300); });
$("range").addEventListener("change", () => { local.set("range24", Number($("range").value)); pinned = null; load(); });
$("refresh").addEventListener("click", () => { load(); loadMarket(); });
applyStatic();
</script>
